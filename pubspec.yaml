name: messagyre_client
description: "Gymnase de Renens' private messaging and personal agenda app."
publish_to: "none" 

version: 1.8.119+119
# 1.1 Added Settings page
# 1.2 Added Homework page
# 1.3 Added Grades page
# 1.4 Automatic login
# 1.5 Added profile pictures
# 1.6 Added profile page
# 1.7 Revamped Grades page
# 1.8 Added notifications

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  settings_ui: ^2.0.2
  image_picker: ^1.0.4
  permission_handler: ^11.3.1
  http: ^0.13.6
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5
  font_awesome_flutter: ^10.7.0
  flutter_secure_storage: ^9.0.0
  collection: ^1.17.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  package_info_plus: ^8.3.1
  modal_bottom_sheet: ^3.0.0
  uuid: ^4.5.1
  flutter_keyboard_visibility: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo_full.png"

flutter_native_splash:
  color: "#ffffff"        
  image: assets/icons/logo_purple.png
  android: true
  ios: true
  android_gravity: center

  color_dark: "#000000"
  image_dark: assets/icons/logo_white.png
