# 4.107 Classes from the server (GET /classes/catalog: the list changes without an app release), app versions in the admin page, more space in the wallpaper page
# 4.108 Global chat (moderated, photos blurred, silenceable), answers to messages (swipe or long press), send button and bubble fixes, previous account's chats removed, file types restricted, texts corrected, idea box removed

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  web_socket_channel: ^3.0.3
  intl: ^0.20.2
  image_picker: ^1.0.4
  http: ^1.5.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.2
  flutter_secure_storage: ^10.0.0-beta.4
  collection: ^1.17.0
  firebase_core: ^2.32.0
  firebase_messaging: ^14.7.10
  package_info_plus: ^9.0.0
  uuid: ^4.5.1
  fl_chart: ^1.1.1
  dotted_border: ^3.1.0
  hugeicons: ^1.1.0
  animated_line_through: ^1.0.5
  image_cropper: ^11.0.0
  flutter_phoenix: ^1.1.1
  flutter_local_notifications: 18.0.1
  image: ^4.5.4
  path_provider: ^2.1.5
  device_calendar: ^4.3.3
  file_picker: ^10.3.7
  path: ^1.9.1
  in_app_review: ^2.0.11
  app_badge_plus: ^1.2.4
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  basic_utils: ^5.7.0
  shared_preferences: ^2.5.4
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  timezone: ^0.9.4
  path_drawing: ^1.0.1
  device_preview: ^1.3.1
  local_auth: ^3.0.1
  stac: ^1.4.0
  local_auth_darwin: ^2.0.3
  local_auth_android: ^2.0.8
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.3.9
  isar_community_generator: ^3.4.1
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/icons/
    - assets/images/
  # Rounded, friendly fonts (SIL Open Font License, see assets/fonts/OFL-*.txt): Nunito for the text, Fredoka for
  # the titles and the big figures
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-500.ttf
          weight: 500
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-500.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-600.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-700.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/full.png" # Generic Icon
  # image_path: "assets/icons/full-christmas.png"   # Christmas Icon

flutter_native_splash:
  android: true
  ios: true

  image: assets/icons/purple.png
  image_dark: assets/icons/white.png

  color: "#ffffff"
  color_dark: "#000000"

  android_gravity: center
